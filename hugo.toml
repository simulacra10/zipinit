baseURL = "https://zipinit.org/"
locale = "en"
title = "ZIP Apportionment Initiative"
theme = "zipinit"

# sitemap.xml and robots.txt are hand-maintained under static/ (they cover
# non-Hugo assets like PDFs and media that Hugo's generators don't know about).
# 404 pages, taxonomies, and RSS aren't used by this site.
disableKinds = ["sitemap", "RSS", "404", "taxonomy", "term"]

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser.attribute]
  title = true
  block = true

[markup.goldmark.extensions]
  [markup.goldmark.extensions.typographer]
    disable = true

[params]
  organizationName = "ZIP Apportionment Initiative"
  organizationEmail = "expand@zipinit.org"
  githubURL = "https://github.com/simulacra10/zipinit"
  signalHandle = "@zipinit.12"
  ogImage = "/preview.jpg"
  ccLicenseYear = "2026"

# Header navigation. "Essays" has no url - it's a disclosure group, not a
# link - grouping the three standalone essay pages, which don't have a
# section/hub page of their own.
[[menu.main]]
  identifier = "essays"
  name = "Essays"
  weight = 1

[[menu.main]]
  parent = "essays"
  name = "Primary Essay"
  url = "/essay.html"
  weight = 1

[[menu.main]]
  parent = "essays"
  name = "Representation Is Broken"
  url = "/representation-is-broken.html"
  weight = 2

[[menu.main]]
  parent = "essays"
  name = "Louisiana v. Callais"
  url = "/louisiana-v-callais.html"
  weight = 3

[[menu.main]]
  name = "Brief"
  url = "/brief.html"
  weight = 2

[[menu.main]]
  name = "Policy Papers"
  url = "/policy-papers/"
  weight = 3

[[menu.main]]
  name = "Pamphlets"
  url = "/pamphlets/"
  weight = 4

[[menu.main]]
  name = "Charter"
  url = "/charter.html"
  weight = 5

[[menu.main]]
  name = "Contact"
  url = "/contact.html"
  weight = 6
